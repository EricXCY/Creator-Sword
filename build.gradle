plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort

    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev"
    }
    maven {
        url = "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }

    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        // Preserve existing worlds while making run isolation explicit.
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
}

// runData needs processResources before launching, so its newly generated files
// otherwise remain absent/stale in the classpath used by an IDE client launch.
def refreshGeneratedResources = tasks.register('refreshGeneratedResources', Copy) {
    from('src/generated/resources') { exclude '.cache/**', '**/*.bbmodel' }
    into layout.buildDirectory.dir('resources/main')
}
tasks.matching { it.name == 'runData' }.configureEach { finalizedBy refreshGeneratedResources }


// Opt-in integration tests run with the real game, registries and Mixin transformations.
if (providers.gradleProperty('flywheelGameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("mezz.jei:jei-$minecraft_version-common-api:$jei_version")
    compileOnly("mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version")
    localRuntime("mezz.jei:jei-$minecraft_version-neoforge:$jei_version")

    compileOnly("dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}")
    localRuntime("dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}")

    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    compileOnly("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}") {
        transitive = false
    }
    localRuntime("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}") {
        transitive = false
    }
    compileOnly("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}") {
        transitive = false
    }
    localRuntime("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}") {
        transitive = false
    }
    localRuntime("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${offroad_version}") {
        transitive = false
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

if (providers.gradleProperty('pedestalGameTests').isPresent()) {
    def pedestalTests = objects.sourceDirectorySet('pedestalTests', 'Sword pedestal game tests')
    pedestalTests.srcDir 'src/gametest/java'
    pedestalTests.include 'com/erix/creatorsword/block/sword_pedestal/**'
    sourceSets.main.java.source(pedestalTests)
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    ['dev.ryanhcode.sable', 'dev.simulated_team.simulated', 'dev.eriksonn.aeronautics', 'dev.ryanhcode.offroad'].each {
        configurations.runtimeClasspath.exclude group: it
    }
}
